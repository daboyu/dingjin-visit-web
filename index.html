<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>鼎金分隊訪視地圖</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;color:#17342e;background:#edf3ef;height:100dvh;display:flex;flex-direction:column}header,form,.tools{padding:10px 14px;background:white;display:flex;gap:8px;align-items:center}header{justify-content:space-between}h1{font-size:18px;margin:0}form{width:min(calc(100% - 24px),390px);margin:12vh auto 0;border-radius:12px;display:grid;padding:18px;gap:12px}button,input,select{font:inherit;min-height:44px;padding:8px;border:1px solid #9cafa7;border-radius:8px;background:white;color:inherit;min-width:0}button{cursor:pointer}form button,.primary{background:#075d50;color:white}#status{margin:0;padding:6px 14px;font-size:13px;min-height:30px}main{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}.tools{flex-wrap:wrap}.tools input{flex:1 1 160px}#map{flex:1;min-height:180px}#results{margin:0;padding:0 12px;list-style:none;max-height:25dvh;overflow:auto;background:white}#results button{width:100%;text-align:left;margin:2px 0}.leaflet-popup-content{max-width:66vw;max-height:38dvh;overflow:auto;font-size:15px}article{margin-bottom:10px}article a{display:inline-flex;min-height:44px;align-items:center;margin-left:8px}[hidden]{display:none!important}
</style></head><body><header><h1>鼎金分隊訪視地圖</h1><button id="logout" hidden>登出</button></header><form id="login"><label for="password">分隊共用密碼</label><input id="password" type="password" autocomplete="current-password" required><button>登入</button></form><p id="status" role="status"></p><main id="app" hidden><div class="tools"><input id="search" type="search" placeholder="搜尋姓名、地址或編號" aria-label="搜尋名冊"><select id="category" aria-label="清冊"><option value="">全部清冊</option><option value="a">重度身障</option><option value="b">鼎金獨居</option></select><button id="locate">我的位置</button></div><ul id="results"></ul><div id="map" aria-label="訪視地圖"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script src="./app.js"></script></body></html>
